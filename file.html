<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FabricVision Operator Dashboard</title>
<style>

/* ==============================
GLOBAL
============================== */
body{
    margin:0;
    font-family: "Segoe UI", Roboto, Arial;
    background:#0f172a;
    color:white;
}

/* ==============================
HEADER
============================== */
.header{
    width:100%;
    background:#111827;
    padding:18px 30px;
    font-size:22px;
    font-weight:600;
    letter-spacing:1px;
    border-bottom:2px solid #1f2937;
}

.header span{
    color:#22c55e;
}

/* ==============================
MAIN DASHBOARD
============================== */

.dashboard{
    display:flex;
    justify-content:center;
    align-items:center;
    height:calc(100vh - 70px);
}

/* ==============================
CARD PANEL
============================== */

.panel{

    width:520px;

    background:#1e293b;

    border-radius:12px;

    padding:35px;

    box-shadow:
        0px 10px 30px rgba(0,0,0,0.6),
        inset 0 0 0 1px rgba(255,255,255,0.05);
}

/* ==============================
TITLE
============================== */

.panel h2{

    text-align:center;

    margin-bottom:25px;

    font-weight:600;

    letter-spacing:1px;

    color:#38bdf8;
}

/* ==============================
ROWS
============================== */

.row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:12px 10px;

    margin-bottom:10px;

    background:#0f172a;

    border-radius:6px;

    border-left:4px solid #334155;
}

.label{

    font-weight:600;

    color:#94a3b8;
}

/* ==============================
VALUE
============================== */

.value{

    font-size:16px;

    font-weight:500;
}

/* ==============================
STATUS COLORS
============================== */

.patterned{

    color:#22c55e;
    font-weight:600;
}

.nonpatterned{

    color:#f87171;
    font-weight:600;
}

/* ==============================
COLOR BOX
============================== */

.colorbox{

    display:inline-block;

    width:14px;

    height:14px;

    border-radius:50%;

    margin-left:8px;

    border:1px solid #ccc;
}

/* ==============================
METRIC HIGHLIGHTS
============================== */

.metric{

    font-size:18px;

    font-weight:700;

    color:#facc15;
}

</style>

</head>

<body>

<div class="header">
FabricVision <span>Operator Dashboard</span>
</div>

<div class="dashboard">

<div class="panel">

<h2>Fabric Inspection Status</h2>

<div class="row">
<div class="label">Fabric Type</div>
<div id="pattern" class="value">-</div>
</div>

<div class="row">
<div class="label">Pattern Type</div>
<div id="pattern_type" class="value">-</div>
</div>

<div class="row">
<div class="label">Dominant Color</div>
<div>
<span id="dominant_color" class="value">-</span>
<span id="dom_color_box" class="colorbox"></span>
</div>
</div>

<div class="row">
<div class="label">Secondary Color</div>
<div>
<span id="secondary_color" class="value">-</span>
<span id="sec_color_box" class="colorbox"></span>
</div>
</div>

<div class="row">
<div class="label">Quality Score</div>
<div id="quality_score" class="value metric">-</div>
</div>

<div class="row">
<div class="label">Enhancement Mode</div>
<div id="enhancement_mode" class="value">-</div>
</div>

<div class="row">
<div class="label">Frames Processed</div>
<div id="frames_processed" class="value metric">-</div>
</div>

<div class="row">
<div class="label">FPS</div>
<div id="fps" class="value metric">-</div>
</div>

</div>
</div>


<script>

async function fetchFabricState(){

    try{

        const response = await fetch("http://localhost:5000/api/fabric-state")

        const data = await response.json()

        const patternEl = document.getElementById("pattern")

        patternEl.innerText = data.pattern

        if(data.pattern === "patterned"){
            patternEl.className="value patterned"
        }else{
            patternEl.className="value nonpatterned"
        }

        document.getElementById("pattern_type").innerText = data.pattern_type

        document.getElementById("dominant_color").innerText = data.dominant_color
        document.getElementById("secondary_color").innerText = data.secondary_color

        document.getElementById("quality_score").innerText = data.quality_score
        document.getElementById("enhancement_mode").innerText = data.enhancement_mode
        document.getElementById("frames_processed").innerText = data.frames_processed
        document.getElementById("fps").innerText = data.fps

        document.getElementById("dom_color_box").style.background = data.dominant_color
        document.getElementById("sec_color_box").style.background = data.secondary_color

    }
    catch(error){

        console.log("API error:",error)

    }

}

fetchFabricState()

setInterval(fetchFabricState,2000)

</script>

</body>
</html>
